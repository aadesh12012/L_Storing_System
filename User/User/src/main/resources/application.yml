server:
  port: 8081

spring:
  application:
    name: user-service

  # ── PostgreSQL datasource ─────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # use Flyway for schema; never let Hibernate recreate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis (OTP cache / token blacklist) ───────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka (publish UserRegistered events) ────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ── JWT config ────────────────────────────────────────────────────
app:
  jwt:
    secret: CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR
    expiration-ms: 86400000   # 24 h

# ── Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    com.UserService: DEBUG
    org.springframework.security: INFO
