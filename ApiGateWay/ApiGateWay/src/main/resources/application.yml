server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Spring Cloud Gateway routes ──────────────────────────────────
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - StripPrefix=0

        - id: provider-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/providers/**
          filters:
            - StripPrefix=0

        - id: location-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/locations/**
          filters:
            - StripPrefix=0

        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

      # Global CORS config
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5174"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "Accept,Authorization,Content-Type,X-User-Id"

      # Default rate-limiter (Redis-backed, RequestRateLimiter filter)
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@clientKeyResolver}"

  # ── Redis (rate limiter) ─────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

# ── JWT shared secret ────────────────────────────────────────────
app:
  jwt:
    secret: CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR
    expiration-ms: 86400000  # 24 h
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5174}

# ── Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.Api_gateway: DEBUG
