server:
  port: 8082

spring:
  application:
    name: provider-service

  # ── PostgreSQL datasource ─────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/provider_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Kafka (consume/publish provider events) ───────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: provider-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# ── Platform pricing guardrails (A-6) ─────────────────────────────
app:
  pricing:
    min-hourly-rate: 0.50
    max-hourly-rate: 50.00

# ── Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    com.ProviderService: DEBUG
